kind = "mobile"
previewPath = "/card-detail-mobile/"
title = "Verified TCG Card Detail"
description = "A standalone mobile card detail experience based on the selected Verified TCG design, with market pricing, grading and population tabs, sold listings, collection controls, and local persistence."
version = "1.0.0"
id = "artifacts/card-detail-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/card-detail-mobile/" ]
localPort = 19027

[services.development]
run = "pnpm --filter @workspace/card-detail-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/card-detail-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/card-detail-mobile", "run", "serve" ]

[services.env]
PORT = "19027"
BASE_PATH = "/card-detail-mobile/"
