kind = "mobile"
previewPath = "/community-mobile/"
title = "Verified TCG Community"
description = "A standalone mobile Community experience based on the selected Verified TCG design, with feed tabs, post composer, card references, reactions, and local persistence."
version = "1.0.0"
id = "artifacts/community-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/community-mobile/" ]
localPort = 23887

[services.development]
run = "pnpm --filter @workspace/community-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/community-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/community-mobile", "run", "serve" ]

[services.env]
PORT = "23887"
BASE_PATH = "/community-mobile/"
