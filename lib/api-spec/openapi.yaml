openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/cards:
    get:
      operationId: searchCatalogCards
      tags: [catalog]
      summary: Search the persisted card catalogue
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Catalogue matches, including an honest empty result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogResponse" }
        "429": { description: Catalogue provider allowance exhausted. }
        "503": { description: Catalogue data is unavailable. }
  /catalog/cards/{id}:
    get:
      operationId: getCatalogCard
      tags: [catalog]
      summary: Read one canonical card
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Canonical card.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CatalogCard" }
                  source: { type: string }
                  cached: { type: boolean }
        "404": { description: Card not found. }
        "503": { description: Catalogue data is unavailable. }
  /catalog/cards/{id}/lookup:
    post:
      operationId: recordCatalogCardLookup
      tags: [catalog]
      summary: Record an aggregate card-detail lookup
      description: Records only an anonymous aggregate count for the current 12-hour window.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Lookup recorded. }
        "401": { description: Authentication required. }
        "404": { description: Card not found. }
        "503": { description: Lookup aggregation is unavailable. }
  /catalog/trending-lookups:
    get:
      operationId: getTrendingCardLookups
      tags: [catalog]
      summary: Get cards with the most aggregate lookups in the current 12-hour window
      responses:
        "200":
          description: Real aggregate lookup ranking with catalogue data and persisted quotes when available.
          content:
            application/json:
              schema:
                type: object
                required: [data, refresh_hours]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogCard" }
                  source: { type: string }
                  window_start: { type: [string, "null"], format: date-time }
                  window_end: { type: [string, "null"], format: date-time }
                  refresh_hours: { type: integer, const: 12 }
        "503": { description: Trending data is unavailable. }
  /collection:
    get:
      operationId: listCollection
      tags: [collection]
      summary: List the authenticated collector's persisted holdings
      responses:
        "200":
          description: Holdings with exact-grade valuations when available.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CollectionItem" }
        "401": { description: Authentication required. }
    post:
      operationId: createCollectionItem
      tags: [collection]
      summary: Add a holding with collector-entered acquisition details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionMutation" }
      responses:
        "201":
          description: Persisted holding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionItem" }
        "400": { description: Invalid acquisition details. }
        "401": { description: Authentication required. }
  /collection/import/preview:
    post:
      operationId: previewCollectionCsvImport
      tags: [collection]
      summary: Validate and match a Collectr or versioned Verified TCG CSV without saving holdings or lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 1048576 }
                filename: { type: string, maxLength: 255 }
                sourceCurrency:
                  type: string
                  pattern: "^[A-Za-z]{3}$"
      responses:
        "200":
          description: User-scoped preview with explicit row outcomes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionImportPreview" }
        "401": { description: Authentication required. }
        "422": { description: "Malformed, oversized, or unsupported CSV." }
        "503": { description: Canonical catalogue matching is unavailable. }
  /collection/import/{jobId}/commit:
    post:
      operationId: commitCollectionCsvImport
      tags: [collection]
      summary: Atomically save confirmed holdings, wishlist matches, custom lists, and memberships
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentSha256]
              properties:
                contentSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                sourceCurrency:
                  type: string
                  pattern: "^[A-Za-z]{3}$"
      responses:
        "200":
          description: Deterministic commit result; replaying the same file returns the original result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionImportCommit" }
        "400": { description: Collectr source currency is missing or invalid. }
        "401": { description: Authentication required. }
        "404": { description: Preview not found for this collector. }
        "409": { description: Preview expired or content fingerprint changed. }
  /collection/import/{jobId}/resolve:
    post:
      operationId: resolveCollectionCsvImport
      tags: [collection]
      summary: Resolve ambiguous CSV card matches against the candidates saved in a preview
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentSha256, resolutions]
              properties:
                contentSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                resolutions:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [rowNumber, cardId]
                    properties:
                      rowNumber: { type: integer, minimum: 2 }
                      cardId: { type: [string, "null"] }
      responses:
        "200":
          description: Updated user-scoped preview with selected card identities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionImportPreview" }
        "400": { description: Invalid row decision or card candidate. }
        "401": { description: Authentication required. }
        "404": { description: Preview not found for this collector. }
        "409": { description: "Preview expired, committed, or content fingerprint changed." }
  /collection/lists:
    get:
      operationId: getCollectionOrganization
      tags: [collection]
      summary: Read the authenticated collector's custom lists and preferences
      responses:
        "200":
          description: Canonical custom-list state.
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionOrganization" } } }
        "401": { description: Authentication required. }
    post:
      operationId: createCollectionList
      tags: [collection]
      summary: Create a user-owned collection list
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectionListNameMutation" } } }
      responses:
        "201": { description: Canonical organization state, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionOrganization" } } } }
        "400": { description: Invalid or excessive list request. }
        "409": { description: A list with this name already exists. }
  /collection/lists/order:
    put:
      operationId: reorderCollectionLists
      tags: [collection]
      summary: Replace the complete ordering of custom lists
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectionListOrderMutation" } } }
      responses:
        "200":
          description: Canonical organization state.
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionOrganization" } } }
        "400": { description: Order does not exactly contain the collector's lists. }
  /collection/lists/{listId}:
    parameters:
      - { name: listId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: renameCollectionList
      tags: [collection]
      summary: Rename an owned custom list
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectionListNameMutation" } } }
      responses:
        "200":
          description: Canonical organization state.
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionOrganization" } } }
        "404": { description: List not found. }
    delete:
      operationId: deleteCollectionList
      tags: [collection]
      summary: Delete a list without deleting its holdings
      responses:
        "200":
          description: Canonical organization state.
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionOrganization" } } }
        "404": { description: List not found. }
  /collection/lists/{listId}/items:
    parameters:
      - { name: listId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: replaceCollectionListMembership
      tags: [collection]
      summary: Replace all list memberships with owned holdings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HoldingIdsMutation" } } }
      responses:
        "200":
          description: Canonical organization state.
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionOrganization" } } }
        "404": { description: List or holding not found. }
    post:
      operationId: addCollectionListMembership
      tags: [collection]
      summary: Add owned holdings to a list
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HoldingIdsMutation" } } }
      responses:
        "200":
          description: Canonical organization state.
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionOrganization" } } }
        "404": { description: List or holding not found. }
  /collection/lists/{listId}/items/{holdingId}:
    delete:
      operationId: removeCollectionListMembership
      tags: [collection]
      summary: Remove one holding membership from an owned list
      parameters:
        - { name: listId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: holdingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Canonical organization state.
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionOrganization" } } }
        "404": { description: List not found. }
  /collection/lists/{listId}/subtotal:
    get:
      operationId: getCollectionListSubtotal
      tags: [collection, portfolio]
      summary: Get authoritative valuation subtotal for unique holdings in a list
      parameters:
        - { name: listId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: displayCurrency, in: query, schema: { type: string, default: AUD } }
      responses: { "200": { description: Pricing-pipeline subtotal, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionListSubtotal" } } } }, "404": { description: List not found. } }
  /collection/preferences:
    get:
      operationId: getCollectionPreferences
      tags: [collection]
      summary: Read persisted collection presentation preferences
      responses: { "200": { description: Preferences, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionPreferences" } } } } }
    put:
      operationId: updateCollectionPreferences
      tags: [collection]
      summary: Replace persisted collection presentation preferences
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectionPreferencesMutation" } } }
      responses:
        "200":
          description: Persisted preferences.
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionPreferences" } } }
        "400": { description: Invalid preference. }
  /collection/bulk:
    post:
      operationId: bulkUpdateCollection
      tags: [collection]
      summary: Atomically assign memberships, update sale/trade flags, or delete owned holdings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectionBulkMutation" } } }
      responses:
        "200":
          description: Canonical organization state and deleted IDs.
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionBulkResponse" } } }
        "400": { description: Invalid bounded bulk operation. }
        "404": { description: Owned list or holding not found. }
  /collection/{id}:
    patch:
      operationId: updateCollectionItem
      tags: [collection]
      summary: Correct quantity, condition, grading, or acquisition cost
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionMutation" }
      responses:
        "200":
          description: Updated holding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionItem" }
        "400": { description: Invalid update. }
        "401": { description: Authentication required. }
        "404": { description: Holding not found. }
    delete:
      operationId: deleteCollectionItem
      tags: [collection]
      summary: Remove a holding
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Holding removed. }
        "401": { description: Authentication required. }
        "404": { description: Holding not found. }
  /collection/summary:
    get:
      operationId: getCollectionSummary
      tags: [portfolio]
      summary: Get authoritative value, cost basis, gain, and coverage
      parameters:
        - { name: displayCurrency, in: query, schema: { type: string, default: AUD } }
      responses:
        "200":
          description: Portfolio summary with explicit pricing completeness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionSummary" }
        "401": { description: Authentication required. }
  /collection/performance:
    get:
      operationId: getCollectionPerformance
      tags: [portfolio]
      summary: Get retained portfolio history and performance
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1D, 7D, 1M, 3M, 6M, 1Y, ALL], default: 1M } }
        - { name: displayCurrency, in: query, schema: { type: string, default: AUD } }
      responses:
        "200":
          description: Real retained observations; never synthetic backfill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionPerformance" }
        "401": { description: Authentication required. }
  /collection/value-history:
    get:
      operationId: getCollectionValueHistory
      tags: [portfolio]
      summary: Get portfolio value history derived from collection holdings
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1D, 7D, 1M, 3M, 6M, 1Y, ALL], default: ALL } }
        - { name: displayCurrency, in: query, schema: { type: string, default: AUD } }
      responses:
        "200":
          description: Historical portfolio points from persisted holdings and prices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionValueHistory" }
        "401": { description: Authentication required. }
  /collection/value-history/movement:
    get:
      operationId: getCollectionValueHistoryMovement
      tags: [portfolio]
      summary: Explain the per-card movement for one retained portfolio day
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: displayCurrency, in: query, schema: { type: string, default: AUD } }
      responses:
        "200":
          description: Exact-grade retained per-card contributions, including explicit unavailable rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioMovementBreakdown" }
        "400": { description: Invalid or future calendar date. }
        "401": { description: Authentication required. }
  /catalog/market-movers:
    get:
      operationId: getMarketMovers
      tags: [market]
      summary: Get persisted comparable price movements
      responses:
        "200":
          description: Snapshot-backed market movements.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogResponse" }
        "503": { description: Market snapshot data is unavailable. }
  /catalog/trending:
    get:
      operationId: getTrendingCards
      tags: [market]
      summary: Get deterministic persisted trend rankings
      responses:
        "200":
          description: Persisted trend results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogResponse" }
        "503": { description: Trend data is unavailable. }
  /catalog/recently-added:
    get:
      operationId: getRecentlyAddedCards
      tags: [market]
      summary: Get recently persisted canonical catalogue records
      responses:
        "200":
          description: Recently added records, with quotes only when available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogResponse" }
        "503": { description: Catalogue data is unavailable. }
  /catalog/cards/{id}/ebay-sold-history:
    get:
      operationId: getEbaySoldHistory
      tags: [pricing]
      summary: Get recent completed eBay sales for a card
      description: Returns normalized completed-sale records and a trend calculated from those exact records. Requires a Pro collector session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
        - name: set
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
        - name: game
          in: query
          required: true
          schema:
            type: string
            enum: [pokemon, onepiece, yugioh, lorcana, dragonball, magic]
        - name: grade
          in: query
          schema:
            type: string
            default: raw
            enum: [raw, psa8, psa9, psa10, cgc10, bgs95, bgs10]
        - name: period
          in: query
          schema:
            type: string
            default: 30d
            enum: [7d, 30d, 90d, 1y, all]
        - name: displayCurrency
          in: query
          schema:
            type: string
            default: AUD
            enum: [AUD, USD, GBP, EUR, CAD, NZD]
      responses:
        "200":
          description: A truthful eBay availability result, including no-results and upstream states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbaySoldHistoryResponse"
        "400":
          description: Invalid card identity or filter.
        "401":
          description: Authentication required.
        "403":
          description: Pro subscription required.
        "429":
          description: Too many eBay sold-history requests.
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CatalogVariant:
      type: object
      properties:
        condition: { type: string }
        price: { type: [number, "null"] }
        lastUpdated: { type: integer }
        markets:
          type: array
          items:
            type: object
            properties:
              region: { type: string }
              currency: { type: string }
              price: { type: [number, "null"] }
    CatalogCard:
      type: object
      required: [id, name, game, variants]
      properties:
        id: { type: string }
        name: { type: string }
        game: { type: string }
        set: { type: string }
        set_name: { type: string }
        number: { type: string }
        rarity: { type: string }
        image_url: { type: string }
        currency: { type: [string, "null"] }
        market_price: { type: [number, "null"] }
        pricing_source: { type: [string, "null"] }
        variants:
          type: array
          items: { $ref: "#/components/schemas/CatalogVariant" }
      additionalProperties: true
    CatalogResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CatalogCard" }
        source: { type: string }
        catalogue_source: { type: string }
        pricing_source: { type: string }
        cached: { type: boolean }
        meta:
          type: object
          additionalProperties: true
    CollectionListNameMutation:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    CollectionListOrderMutation:
      type: object
      required: [listIds]
      properties:
        listIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
    HoldingIdsMutation:
      type: object
      required: [holdingIds]
      properties:
        holdingIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
    CollectionList:
      type: object
      required: [id, name, position, createdAt, updatedAt, holdingIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        holdingIds: { type: array, items: { type: string, format: uuid } }
    CollectionPreferences:
      type: object
      required: [viewMode, selectedListId, filterState, sortKey, updatedAt]
      properties:
        viewMode: { type: string, enum: [grid, list, compact] }
        selectedListId: { type: [string, "null"], format: uuid }
        filterState: { type: object, additionalProperties: true }
        sortKey: { type: string, enum: [date_desc, date_asc, name_asc, name_desc, value_desc, value_asc, quantity_desc, quantity_asc, gain_desc, gain_asc] }
        updatedAt: { type: [string, "null"], format: date-time }
    CollectionPreferencesMutation:
      type: object
      properties:
        viewMode: { type: string, enum: [grid, list, compact] }
        selectedListId: { type: [string, "null"], format: uuid }
        filterState: { type: object, additionalProperties: true }
        sortKey: { type: string, enum: [date_desc, date_asc, name_asc, name_desc, value_desc, value_asc, quantity_desc, quantity_asc, gain_desc, gain_asc] }
    CollectionOrganization:
      type: object
      required: [lists, preferences]
      properties:
        lists: { type: array, items: { $ref: "#/components/schemas/CollectionList" } }
        preferences: { $ref: "#/components/schemas/CollectionPreferences" }
    CollectionListSubtotal:
      type: object
      required: [listId, currency, holdingCount, uniqueHoldingCount, totalValueCents, totalValue, totalCostCents, totalCost, pricedHoldings, totalHoldings, valuationComplete]
      properties:
        listId: { type: string, format: uuid }
        currency: { type: string }
        holdingCount: { type: integer }
        uniqueHoldingCount: { type: integer }
        totalValueCents: { type: [integer, "null"] }
        totalValue: { type: [number, "null"] }
        totalCostCents: { type: [integer, "null"] }
        totalCost: { type: [number, "null"] }
        pricedHoldings: { type: integer }
        totalHoldings: { type: integer }
        valuationComplete: { type: boolean }
    CollectionBulkMutation:
      type: object
      required: [holdingIds]
      properties:
        holdingIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        assignToListId: { type: string, format: uuid }
        removeFromListId: { type: string, format: uuid }
        isForSale: { type: boolean }
        isForTrade: { type: boolean }
        delete: { type: boolean }
    CollectionBulkResponse:
      allOf:
        - { $ref: "#/components/schemas/CollectionOrganization" }
        - type: object
          required: [deletedHoldingIds]
          properties:
            deletedHoldingIds:
              type: array
              items: { type: string, format: uuid }
    CollectionMutation:
      type: object
      properties:
        cardId: { type: string }
        card: { type: object, additionalProperties: true }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
        condition: { type: string, enum: [mint, near_mint, excellent, good, light_played, played, poor] }
        grading: { type: [object, "null"], additionalProperties: true }
        acquiredAt: { type: string, format: date }
        acquiredPrice: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        notes: { type: string, maxLength: 2000 }
        isForSale: { type: boolean }
        isForTrade: { type: boolean }
    CollectionItem:
      allOf:
        - { $ref: "#/components/schemas/CollectionMutation" }
        - type: object
          required: [id, cardId, card, quantity, condition, acquiredAt, acquiredPrice, currency]
          properties:
            id: { type: string }
            valuation:
              type: [object, "null"]
              properties:
                priceCents: { type: integer }
                price: { type: number }
                currency: { type: string }
                gradeKey: { type: string }
                updatedAt: { type: string, format: date-time }
    CollectionImportPreviewRow:
      type: object
      required: [rowNumber, status]
      properties:
        recordType: { type: string, enum: [holding, list] }
        rowNumber: { type: integer, minimum: 2 }
        status:
          type: string
          enum: [matched, watchlist_only, ambiguous, invalid, unmatched, duplicate, valid]
        isWatchlistOnly: { type: boolean }
        name: { type: string }
        position: { type: integer, minimum: 0 }
        holdingId: { type: string, format: uuid }
        listNames:
          type: array
          items: { type: string }
        cardId: { type: string }
        canonicalCardId: { type: string }
        card: { type: object, additionalProperties: true }
        candidates:
          type: array
          items:
            type: object
            required: [cardId, card]
            properties:
              cardId: { type: string }
              card: { type: object, additionalProperties: true }
        candidateCount: { type: integer, minimum: 0 }
        error: { type: string }
        quantity: { type: integer, minimum: 1 }
        condition: { type: string }
        acquiredAt: { type: string, format: date }
        acquiredPrice: { type: number, minimum: 0 }
        currency: { type: string }
        notes: { type: string }
        finish: { type: string }
        variance: { type: string }
        grading: { type: object, additionalProperties: true }
        desiredGrade: { type: string }
        supportedGrade: { type: boolean }
        pricingAvailable: { type: boolean }
    CollectionImportPreview:
      type: object
      required: [jobId, source, schemaVersion, contentSha256, summary, rows]
      properties:
        jobId: { type: string, format: uuid }
        source: { type: string, enum: [collectr, verified_tcg] }
        schemaVersion: { type: integer, enum: [1, 2] }
        contentSha256: { type: string }
        status: { type: string }
        summary:
          type: object
          required: [total, matched, watchlistOnly, invalid, ambiguous, unmatched, duplicate, priced]
          properties:
            total: { type: integer }
            matched: { type: integer }
            watchlistOnly: { type: integer }
            invalid: { type: integer }
            ambiguous: { type: integer }
            unmatched: { type: integer }
            duplicate: { type: integer }
            priced: { type: integer }
            listCount: { type: integer }
            membershipCount: { type: integer }
            listsToCreate:
              type: array
              items: { type: string }
            listsToMerge:
              type: array
              items: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/CollectionImportPreviewRow" }
    CollectionImportCommit:
      type: object
      required: [jobId, status, summary, rows]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [committed] }
        replayed: { type: boolean }
        summary:
          type: object
          required: [holdingsAdded, wishlistAdded, skipped, duplicates, unsupportedGrades]
          properties:
            holdingsAdded: { type: integer }
            wishlistAdded: { type: integer }
            skipped: { type: integer }
            duplicates: { type: integer }
            unsupportedGrades: { type: integer }
            listsCreated: { type: integer }
            listsMerged: { type: integer }
            membershipsAdded: { type: integer }
            membershipDuplicates: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [rowNumber, status]
            properties:
              rowNumber: { type: integer }
              status:
                type: string
                enum: [holding_added, wishlist_added, wishlist_existing, list_created, list_merged, duplicate, skipped]
              cardId: { type: string }
              listName: { type: string }
              reason: { type: string }
    CollectionSummary:
      type: object
      required: [totalValue, totalCost, unrealizedGain, cardCount, uniqueCardCount, currency, coverage, completeness, chartData]
      properties:
        totalValue: { type: [number, "null"] }
        totalCost: { type: [number, "null"] }
        unrealizedGain: { type: [number, "null"] }
        unrealizedGainPercent: { type: [number, "null"] }
        realisedGain: { type: [number, "null"] }
        cardCount: { type: integer }
        uniqueCardCount: { type: integer }
        currency: { type: string }
        coverage:
          type: object
          required: [pricedHoldings, totalHoldings, ratio, freshHoldings, staleHoldings]
          properties:
            pricedHoldings: { type: integer }
            totalHoldings: { type: integer }
            ratio: { type: number }
            freshHoldings: { type: integer }
            staleHoldings: { type: integer }
        completeness: { type: string }
        chartData:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/PortfolioValuePoint"
    PortfolioValuePoint:
      type: object
      required: [date, value, currency]
      properties:
        date: { type: string, format: date }
        value: { type: number }
        currency: { type: string }
    CollectionValueHistory:
      type: object
      required: [range, currency, points, chartData, historyAvailable]
      properties:
        range:
          type: string
          enum: [1D, 7D, 1M, 3M, 6M, 1Y, ALL]
        currency: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/PortfolioValuePoint" }
        chartData:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/PortfolioValuePoint" }
        historyAvailable: { type: boolean }
        historyUnavailableReason: { type: [string, "null"] }
    PortfolioMovementContribution:
      type: object
      required:
        - id
        - cardId
        - name
        - setName
        - imageUrl
        - quantity
        - gradeKey
        - kind
        - amountCents
        - amount
        - previousValueCents
        - previousValue
        - valueCents
        - value
        - available
        - unavailableReason
      properties:
        id: { type: string }
        cardId: { type: string }
        name: { type: string }
        setName: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        quantity: { type: integer }
        gradeKey: { type: [string, "null"] }
        kind:
          type: string
          enum: [market_price, acquisition, sale]
        amountCents: { type: [integer, "null"] }
        amount: { type: [number, "null"] }
        previousValueCents: { type: [integer, "null"] }
        previousValue: { type: [number, "null"] }
        valueCents: { type: [integer, "null"] }
        value: { type: [number, "null"] }
        available: { type: boolean }
        unavailableReason: { type: [string, "null"] }
    PortfolioMovementBreakdown:
      type: object
      required:
        - date
        - previousDate
        - currency
        - available
        - previousAvailable
        - breakdownAvailable
        - totalChangeCents
        - totalChange
        - contributions
        - unavailableReason
      properties:
        date: { type: string, format: date }
        previousDate: { type: [string, "null"], format: date }
        currency: { type: string }
        available: { type: boolean }
        previousAvailable: { type: boolean }
        breakdownAvailable: { type: boolean }
        totalChangeCents: { type: [integer, "null"] }
        totalChange: { type: [number, "null"] }
        contributions:
          type: array
          items: { $ref: "#/components/schemas/PortfolioMovementContribution" }
        unavailableReason: { type: [string, "null"] }
    CollectionPerformance:
      type: object
      required: [points, currency, historyAvailable, completeness]
      properties:
        points:
          type: array
          items:
            type: object
            required: [date, value, currency]
            properties:
              date: { type: string, format: date }
              value: { type: number }
              currency: { type: string }
        currency: { type: string }
        historyAvailable: { type: boolean }
        historyUnavailableReason: { type: [string, "null"] }
        completeness: { type: string }
      additionalProperties: true
    EbaySale:
      type: object
      required: [title, endedAt, condition, priceCents, price, currency, url]
      properties:
        title: { type: string }
        endedAt: { type: string, format: date-time }
        condition: { type: [string, "null"] }
        priceCents: { type: number }
        price: { type: number }
        currency: { type: string }
        url: { type: string }
    EbaySoldHistoryPoint:
      type: object
      required: [date, priceCents, price, currency]
      properties:
        date: { type: string, format: date }
        priceCents: { type: number }
        price: { type: number }
        currency: { type: string }
    EbaySoldHistoryMovement:
      type: [object, "null"]
      properties:
        absolute: { type: number }
        percent: { type: number }
        direction:
          type: string
          enum: [up, down, flat]
    EbaySoldHistoryResponse:
      type: object
      required:
        - cardId
        - gradeKey
        - period
        - currency
        - source
        - configured
        - availability
        - coverage
        - message
        - sales
        - points
        - movement
        - returnedAt
      properties:
        cardId: { type: string }
        gradeKey: { type: string }
        period: { type: string }
        currency: { type: string }
        source:
          type: string
          enum: [ebay_completed_sales]
        configured: { type: boolean }
        availability:
          type: string
          enum: [available, no_results, configuration_error, authorization_error, permission_error, upstream_error]
        coverage:
          type: string
          enum: [returned_results, provider_limited]
        message: { type: [string, "null"] }
        sales:
          type: array
          items: { $ref: "#/components/schemas/EbaySale" }
        points:
          type: array
          items: { $ref: "#/components/schemas/EbaySoldHistoryPoint" }
        movement: { $ref: "#/components/schemas/EbaySoldHistoryMovement" }
        returnedAt: { type: string, format: date-time }

